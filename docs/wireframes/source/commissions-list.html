#obra-commissions-list {--cl-bg:#FFF8EF;--cl-surface:#FFFDF9;--cl-ink:#302C37;--cl-muted:#6B6270;--cl-line:#746A76;--cl-rule:#D8CEC4;--cl-yellow:#FFD15B;padding:18px 0;background-color:transparent;}
#obra-commissions-list * {box-sizing:border-box;}
#obra-commissions-list .cl-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 22px;max-width:736px;margin:auto;align-items:start;}
#obra-commissions-list figure {margin:0;min-width:0;}
#obra-commissions-list .cl-phone {width:100%;aspect-ratio:411/914;min-height:790px;background:var(--cl-bg);color:var(--cl-ink);border:1px solid var(--cl-line);border-radius:27px;display:flex;flex-direction:column;font:500 12px/1.4 'Mali',sans-serif;color-scheme:light;}
#obra-commissions-list h2,#obra-commissions-list h3,#obra-commissions-list p {margin:0;}
#obra-commissions-list svg {width:16px;height:16px;stroke-width:1.7;flex-shrink:0;}
#obra-commissions-list .cl-status {display:flex;justify-content:space-between;align-items:center;padding:11px 18px 0;font:600 11px/1.3 system-ui,sans-serif;}
#obra-commissions-list .cl-status>span:last-child {display:flex;gap:5px;}
#obra-commissions-list .cl-status svg {width:14px;height:14px;}
#obra-commissions-list .cl-main {display:flex;flex-direction:column;gap:14px;padding:20px 18px 16px;flex:1;}
#obra-commissions-list .cl-header {display:flex;justify-content:space-between;align-items:center;gap:8px;}
#obra-commissions-list h2 {font:500 25px/1.25 'DynaPuff',sans-serif;letter-spacing:-.5px;}
#obra-commissions-list .cl-new {display:flex;align-items:center;justify-content:center;gap:4px;min-height:35px;padding:7px 10px;border:1.2px solid var(--cl-ink);border-radius:12px 15px 11px 14px;background:var(--cl-yellow);font:400 12px/1.3 'DynaPuff',sans-serif;}
#obra-commissions-list .cl-new svg {width:13px;height:13px;}
#obra-commissions-list .cl-subtitle {color:var(--cl-muted);font-size:12px;margin-top:-7px;}
#obra-commissions-list .cl-search {display:flex;align-items:center;gap:8px;min-height:43px;padding:10px 12px;border:1px solid var(--cl-line);border-radius:13px 16px 12px 15px;background:var(--cl-surface);color:var(--cl-muted);font-size:12px;}
#obra-commissions-list .cl-tabs {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
#obra-commissions-list .cl-tabs>span {min-height:35px;display:flex;align-items:center;justify-content:center;padding:7px 5px;border:1px solid #C2B5B8;border-radius:12px 15px 11px 14px;font-size:12px;}
#obra-commissions-list .cl-tabs .cl-selected {background:var(--cl-ink);color:var(--cl-bg);border-color:var(--cl-ink);}
#obra-commissions-list .cl-list-meta {display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--cl-muted);}
#obra-commissions-list .cl-list-meta>span:last-child {display:flex;gap:4px;align-items:center;}
#obra-commissions-list .cl-list-meta svg {width:11px;height:11px;}
#obra-commissions-list .cl-list {display:flex;flex-direction:column;gap:10px;}
#obra-commissions-list .cl-card {display:flex;flex-direction:column;gap:5px;padding:12px;background:var(--cl-surface);border:1px solid var(--cl-line);border-radius:18px 21px 17px 20px;}
#obra-commissions-list .cl-card-head {display:flex;align-items:center;justify-content:space-between;gap:6px;}
#obra-commissions-list h3 {font:400 15px/1.3 'DynaPuff',sans-serif;}
#obra-commissions-list .cl-card-head>svg {width:12px;height:12px;color:var(--cl-muted);}
#obra-commissions-list .cl-card>p {font-size:12px;color:var(--cl-muted);}
#obra-commissions-list .cl-card-stage {display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:3px;font-size:11px;color:var(--cl-muted);}
#obra-commissions-list .cl-badge {display:inline-flex;align-items:center;align-self:start;border-radius:7px;padding:3px 7px;font-size:11px;}
#obra-commissions-list .cl-purple {background:#EDE4F4;color:#5D4975;}
#obra-commissions-list .cl-gold {background:#F6EBCB;color:#725A20;}
#obra-commissions-list .cl-green {background:#E7EEDB;color:#3E6040;}
#obra-commissions-list .cl-urgent {color:#8E452A;}
#obra-commissions-list .cl-card-money {display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:3px;font-size:11px;color:var(--cl-muted);}
#obra-commissions-list .cl-card-money strong {font-weight:600;color:var(--cl-ink);}
#obra-commissions-list .cl-card-money .cl-paid {color:#3E6040;}
#obra-commissions-list .cl-card-money .cl-urgent {color:#8E452A;}
#obra-commissions-list .cl-queue-date {font-size:11px;color:var(--cl-muted);}
#obra-commissions-list .cl-scroll {display:flex;justify-content:center;align-items:center;gap:6px;color:var(--cl-muted);font-size:11px;margin-top:auto;}
#obra-commissions-list .cl-scroll svg {width:13px;height:13px;}
#obra-commissions-list .cl-nav {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:9px 10px 0;border-top:1px solid var(--cl-rule);}
#obra-commissions-list .cl-nav>div {display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 1px;color:var(--cl-muted);font-size:11px;border-radius:11px;}
#obra-commissions-list .cl-nav .cl-active {background:#F0E7DC;color:var(--cl-ink);}
#obra-commissions-list .cl-system {display:flex;justify-content:center;padding:12px 0 9px;}
#obra-commissions-list .cl-system>span {height:4px;width:88px;background:var(--cl-ink);border-radius:4px;}
#obra-commissions-list .cl-empty {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;flex:1;text-align:center;padding:30px 5px 60px;}
#obra-commissions-list .cl-empty-icon {display:grid;place-items:center;width:70px;height:75px;border-radius:22px 26px 21px 25px;background:#ECEBDC;color:#6A507D;}
#obra-commissions-list .cl-empty-icon svg {width:32px;height:32px;stroke-width:1.4;}
#obra-commissions-list .cl-empty h3 {font-size:20px;}
#obra-commissions-list .cl-empty>p {font-size:13px;line-height:1.6;color:var(--cl-muted);}
#obra-commissions-list .cl-empty-add {display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 17px;min-height:45px;background:var(--cl-yellow);border:1.3px solid var(--cl-ink);border-radius:16px 20px 15px 19px;font:400 14px/1.3 'DynaPuff',sans-serif;box-shadow:0 2px 0 var(--cl-ink);margin-top:6px;}
#obra-commissions-list figcaption {font:400 12px/1.5 'Mali',sans-serif;color:var(--muted-foreground);text-align:center;margin-top:11px;}
@media(max-width:680px){#obra-commissions-list .cl-grid {grid-template-columns:1fr;max-width:411px;gap:26px;}#obra-commissions-list .cl-phone {min-height:914px;}#obra-commissions-list .cl-main {padding-inline:20px;}}
</style>
