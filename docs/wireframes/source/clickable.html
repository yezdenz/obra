      if(route.step<4){route.step++;render();return;}
      busy=true;const edit=route.mode==='edit',saved=M.saveCommission(db,draft,edit?route.id:undefined);persist();draft=null;
      if(stack.at(-1)?.route.emptyPreview)delete stack.at(-1).route.emptyPreview;
      resultRoute({screen:'details',id:saved.id});toast(edit?'Commission updated':'Commission added to your queue');
    }catch(error){busy=false;formError(error);}
  }
  function openPayment() { const c=cget(route.id);if(!remaining(c)){toast('This commission is already fully paid.');return;} paymentDraft={id:M.id(),amount:remaining(c),date:M.TODAY,method:'GCash',note:''};originalPayment=JSON.stringify(paymentDraft);go({screen:'payment',id:c.id}); }
  function openViewer(source,index=0) {
    const c=route.screen==='form'?draft:cget(route.id),images=source==='draft'?draft.images:source==='final'?c.finalImages:c.images;
    if(!images.length){toast('No images attached.');return;}
    zoom=1;pan={x:0,y:0};go({screen:'viewer',id:c.id,images:M.copy(images),index,title:c.title||'New commission',client:(c.username||'Client')+' · '+c.platform,kind:source==='final'?'Final artwork':'Reference'});
  }
  function applyZoom() { const image=$('#preview-image');if(image)image.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;const minus=$('[data-action="zoom-out"]');if(minus)minus.disabled=zoom<=1;const plus=$('[data-action="zoom-in"]');if(plus)plus.disabled=zoom>=4; }
  function zoomTo(value) {zoom=Math.max(1,Math.min(4,value));if(zoom===1)pan={x:0,y:0};applyZoom();}
  function selectImage(index) { route.index=index;zoom=1;pan={x:0,y:0};render(); }
  function demoJump(value) {
    closeDialog();stack=[];ui.query='';
    if(value.startsWith('add-')){openDraft('add');Object.assign(draft,{username:'luna.art',name:'Luna',title:'Moonlit portrait',type:'Half body',tags:['Fantasy','Soft light'],brief:'Relaxed pose, looking over the shoulder. Soft moonlight and a detailed background.',images:M.copy(cget('moon').images),agreed:2000,due:'2026-11-20',start:'2026-11-12'});originalDraft=JSON.stringify(draft);route.step=Number(value.at(-1));render();return;}
    if(value.startsWith('edit-')){route={screen:'details',id:'fantasy'};openDraft('edit','fantasy');if(value==='edit-4')draft.due='2026-11-16';route.step=Number(value.at(-1));render();return;}
    if(['current','queue','completed','empty-list'].includes(value)){ui.listTab=value==='queue'?'Queued':value==='completed'?'Completed':'In progress';ui.query='';route={screen:'list',emptyPreview:value==='empty-list'};render();return;}
    if(['details','details-lower','queued-detail','completed-detail','payments','payment','progress','complete','viewer','final-viewer'].includes(value)){
      const cid=value==='queued-detail'?'moon':value==='completed-detail'||value==='final-viewer'?'cafe':['payment','payments'].includes(value)?'kai':'fantasy';route={screen:'details',id:cid};
      if(value==='details-lower'){render();$('#app .scroll-body').scrollTop=480;return;}
      if(value==='payment'){openPayment();return;}
      if(value==='progress'||value==='complete'){selectedStage=value==='complete'?'Finished':cget(cid).stage;stack.push({route:M.copy(route),scroll:0});route={screen:'progress',id:cid};if(value==='complete'){stack.push({route:M.copy(route),scroll:0});route={screen:'complete',id:cid};finishDate=M.TODAY;}render();return;}
      if(value==='payments'){go({screen:'payments',id:cid});return;}
      if(value==='viewer'||value==='final-viewer'){openViewer(value==='viewer'?'references':'final');return;}
      render();return;
    }
    if(value==='empty-history'){ui.historyMonth='2026-01';route={screen:'history'};render();return;}
    if(value==='history')ui.historyMonth='2026-11';
    if(value==='insights-lower'){route={screen:'insights'};render();$('#balances-section').scrollIntoView({block:'start'});return;}
    route={screen:value};render();
  }
  wireRoot.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
    const action=el.dataset.action;
    try {
      if(action==='dialog-close'){closeDialog();return;}
      if(action==='dialog-confirm'){const fn=modalAction;closeDialog();fn?.();return;}
      if(action==='undo'){const fn=toastAction;$('#toast').innerHTML='';toastAction=null;fn?.();return;}
      if(action==='nav'){mainNav(el.dataset.screen);return;}
      if(action==='back'){back();return;}
      if(action==='leave'){leaveForm(route.screen==='complete'?()=>{while(stack.at(-1)?.route.screen==='progress')stack.pop();back();}:back);return;}
      if(action==='form-back'){if(route.step>1){route.step--;render();}else leaveForm();return;}
      if(action==='add'){openDraft('add');return;}
      if(action==='edit'){openDraft('edit',route.id);return;}
      if(action==='details'){go({screen:'details',id:el.dataset.id});return;}
      if(action==='current'||action==='queue'){ui.listTab=action==='queue'?'Queued':'In progress';ui.query='';go({screen:'list'});return;}
      if(action==='tasks'){go({screen:'tasks'});return;}
      if(action==='task-home'){mainNav('home');return;}
      if(action==='list-tab'){ui.listTab=el.dataset.tab;ui.query='';render();return;}
      if(action==='clear-search'){ui.query='';render();return;}
      if(action==='home-insights'){ui.insightMonth='2026-11';go({screen:'insights'});return;}
      if(action==='payments'){go({screen:'payments',id:route.id});return;}
      if(action==='record'){openPayment();return;}
      if(action==='back-commission'){if(stack.at(-1)?.route.screen==='details')back();else resultRoute({screen:'details',id:route.id});return;}
      if(action==='progress'){selectedStage=cget(route.id).stage;go({screen:'progress',id:route.id});return;}
      if(action==='save-progress'){if(selectedStage==='Finished'){finishDate=M.TODAY;go({screen:'complete',id:route.id});}else{M.setStage(db,route.id,selectedStage);persist();back();toast('Progress updated');}return;}
      if(action==='start'){const cid=route.id;dialog('Start this commission?','This moves the artwork into Current and starts at Sketch. Payments stay as they are.','Start commission',()=>{M.startCommission(db,cid);persist();render();toast('Commission started');},false,'Not yet');return;}
      if(action==='more'){const cid=route.id;dialog('Cancel this commission?','The artwork will move out of your active queue. Its details and received-payment history are kept.','Cancel commission',()=>{M.cancelCommission(db,cid);persist();render();toast('Commission cancelled');},true,'Keep commission');return;}
      if(action==='review-edit'){route.step=Number(el.dataset.step);render();return;}
      if(action==='view-image'){openViewer(el.dataset.source,Number(el.dataset.index));return;}
      if(action==='original-references'){openViewer('references');return;}
      if(action==='remove-image'){draft.images.splice(Number(el.dataset.index),1);renderScroll=currentScroll();render();return;}
      if(action==='image-next'){selectImage(route.index+1);return;}
      if(action==='image-prev'){selectImage(route.index-1);return;}
      if(action==='image-index'){selectImage(Number(el.dataset.index));return;}
      if(action==='zoom-in'){zoomTo(zoom+.5);return;}
      if(action==='zoom-out'){zoomTo(zoom-.5);return;}
      if(action==='fit-image'){pan={x:0,y:0};zoomTo(1);return;}
      if(action==='image-retry'){$('#image-error').hidden=true;$('#preview-image').src=route.images[route.index].src;return;}
      if(action==='insight-payments'){ui.historyMonth=ui.insightMonth;go({screen:'history'});return;}
      if(action==='see-balances'){$('#balances-section').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
      if(action==='choose-history-month'){$('#history-month').focus();try{$('#history-month').showPicker();}catch{}return;}
    }catch(error){formError(error);}
  });
  wireRoot.addEventListener('input',event=>{
    const el=event.target;
    if(el.id==='commission-search'){
      const start=el.selectionStart,end=el.selectionEnd;ui.query=el.value;render();const search=$('#commission-search');search.focus();search.setSelectionRange(start,end);return;
    }
    syncField(el);
  });
  wireRoot.addEventListener('change',async event=>{
    const el=event.target;
    if(el.dataset.task){const cid=el.dataset.cid,tid=el.dataset.task;M.toggleTask(db,cid,tid);persist();renderScroll=currentScroll();render();toast(el.checked?'Task completed':'Task reopened',()=>{M.toggleTask(db,cid,tid);persist();renderScroll=currentScroll();render();});return;}
    if(el.id==='recommendation-work'){ui.reconnectCommission=el.value;render();return;}
    if(el.id==='history-month'||el.id==='insight-month'){
      if(!/^\d{4}-\d{2}$/.test(el.value))return;
      if(el.id==='history-month')ui.historyMonth=el.value;else ui.insightMonth=el.value;render();return;
    }
    if(el.id==='reference-files'){
      try{
        const files=Array.from(el.files||[]);if(files.length+draft.images.length>6)throw new Error('Keep up to 6 reference images.');
        if(files.some(file=>!file.type.startsWith('image/')||file.size>1024*1024))throw new Error('Choose image files no larger than 1 MB each.');
        const loaded=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,src:reader.result});reader.onerror=()=>reject(new Error('This image could not be read.'));reader.readAsDataURL(file);})));draft.images.push(...loaded);renderScroll=currentScroll();render();
      }catch(error){formError(error);}return;
    }
    syncField(el);
    if(route.screen==='form'&&['type','background','initialEnabled'].includes(el.name)){
      if(route.mode==='add'&&el.name!=='initialEnabled')draft.agreed=basePrice(draft.type)+(draft.background?500:0);
      renderScroll=currentScroll();render();
    }
    if(route.screen==='progress'&&el.name==='stage'){selectedStage=el.value;render();}
  });
  wireRoot.addEventListener('submit',event=>{
    if(event.target.id==='commission-form'){submitCommission(event);return;}
    if(event.target.id==='payment-form'){
      event.preventDefault();if(busy)return;try{busy=true;M.addPayment(db,route.id,paymentDraft);persist();resultRoute({screen:'payments',id:route.id});toast('Payment recorded');}catch(error){busy=false;formError(error);}return;
    }
    if(event.target.id==='complete-form'){
      event.preventDefault();if(busy)return;try{busy=true;const cid=route.id;M.completeCommission(db,cid,finishDate);persist();while(stack.at(-1)?.route.screen==='progress')stack.pop();resultRoute({screen:'details',id:cid});toast('Commission completed');}catch(error){busy=false;formError(error);}
    }
  });
  wireRoot.addEventListener('keydown',event=>{
    if($('#overlay').children.length){if(event.key==='Escape'){event.preventDefault();closeDialog();}if(event.key==='Tab'){const items=[...$('#overlay').querySelectorAll('button')];if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0].focus();}}return;}
    if(route.screen==='viewer'&&event.key==='Escape'){back();}
  });
  wireRoot.addEventListener('pointerdown',event=>{
    if(!event.target.closest('#image-stage'))return;
    const stage=$('#image-stage');stage.setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});previousPoint={x:event.clientX,y:event.clientY};if(pointers.size===2){const p=[...pointers.values()];pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
  });
  wireRoot.addEventListener('pointermove',event=>{
    if(!pointers.has(event.pointerId))return;
    const next={x:event.clientX,y:event.clientY};pointers.set(event.pointerId,next);
    if(pointers.size===2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchDistance)zoomTo(zoom*dist/pinchDistance);pinchDistance=dist;}
    else if(zoom>1&&previousPoint){const box=$('#image-stage').getBoundingClientRect(),maxX=box.width*(zoom-1)/2,maxY=box.height*(zoom-1)/2;pan.x=Math.max(-maxX,Math.min(maxX,pan.x+next.x-previousPoint.x));pan.y=Math.max(-maxY,Math.min(maxY,pan.y+next.y-previousPoint.y));applyZoom();}previousPoint=next;
  });
  ['pointerup','pointercancel'].forEach(name=>wireRoot.addEventListener(name,event=>{pointers.delete(event.pointerId);previousPoint=null;pinchDistance=0;}));
  $('#screen-picker').addEventListener('change',event=>{const value=event.target.value;if(draftChanged())dialog('Discard changes?','Jumping to another wireframe will leave these unsaved edits.','Discard and switch',()=>demoJump(value),true);else demoJump(value);});
  $('#reset-demo').addEventListener('click',()=>dialog('Reset demo data?','This replaces only the fictional prototype data in this browser. Your saved wireframe documents are unchanged.','Reset demo',()=>{db=M.newDemo();draft=null;paymentDraft=null;ui.listTab='In progress';ui.query='';ui.historyMonth='2026-11';ui.insightMonth='2026-11';ui.reconnectCommission='fantasy';persist();mainNav('home');$('#screen-picker').value='home';toast('Demo reset');},true,'Keep demo'));
  // Invoke local form handlers directly; the conversation sandbox does not submit forms.
  wireRoot.addEventListener('click', event => {
    const submitButton = event.target.closest('button[type="submit"][form]');
    if (!submitButton || submitButton.disabled) return;
    event.preventDefault();
    const form = wireRoot.querySelector('#' + submitButton.getAttribute('form'));
    form?.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  });
  wireRoot.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.target.tagName !== 'INPUT' || event.target.type === 'file') return;
    const form = event.target.closest('form');
    if (!form) return;
    event.preventDefault();
    form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  });
  persist();route={screen:'reconnect'};render();$('#screen-picker').value='reconnect';
})();
</script>
